name: Zoya Smoke Test (temporary)

# One-off manual verification for the Zoya migration (PR #16). Read-only: no DB writes,
# no commits, no trades. Delete this workflow once the migration is confirmed working.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Zoya smoke test
        env:
          ZOYA_API_KEY: ${{ secrets.ZOYA_API_KEY }}
          ALPACA_INDEX_API_KEY: dummy
          ALPACA_INDEX_API_SECRET: dummy
        run: python scripts/zoya_smoke_test.py
